plugins { id 'com.android.application' }
android {
    namespace 'local.linx.android'
    compileSdk 35
    defaultConfig { applicationId 'local.linx.android'; minSdk 26; targetSdk 35; versionCode 3; versionName '1.2.1'; testInstrumentationRunner 'local.linx.android.SmokeInstrumentation' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { release { minifyEnabled false } }
}
